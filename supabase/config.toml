project_id = "ai-influencer-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
enable_signup = false
site_url = "http://localhost:3000"
# İkinci adres: panel MCP sunucusunun tarayıcıyla girişi (pnpm mcp:login, docs/mcp-panel.md).
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://127.0.0.1:47821/callback"]

# [auth.email] enable_signup'ı false yapma: CLI bunu e-posta sağlayıcısını
# tamamen kapatma olarak yorumlar ve magic link girişi de çalışmaz.
# Yeni kayıtları kapatmak için yukarıdaki [auth] enable_signup = false yeterli.

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[storage.buckets.assets]
public = false
file_size_limit = "100MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/avif", "video/mp4", "video/webm"]

# Marka deal dosyaları (sözleşme). Migration 20261022232000_brand_crm.sql ile aynı sınırlar.
[storage.buckets.contracts]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

# Üretim işi çıktıları (#211): <workspace_id>/<job_id>/<dosya>. Policy'ler migration'da.
[storage.buckets.productions]
public = false
file_size_limit = "100MiB"
allowed_mime_types = ["video/mp4", "video/webm", "audio/mpeg", "audio/mp4", "audio/wav", "image/jpeg", "image/png", "image/webp", "application/json", "text/plain", "text/vtt", "application/x-subrip"]

[inbucket]
enabled = true
port = 54324

# Üretim kuyruğu worker'ı (#47): pg_cron çağırır, doğrulama x-cron-secret ile.
[functions.process-generations]
verify_jwt = false

# #53: pg_cron/pg_net çağırır; doğrulama JWT yerine x-cron-secret ile (docs/DEVELOPMENT.md §9).
[functions.sync-dispatch]
verify_jwt = false

# #58 yayın kuyruğu: pg_cron/pg_net çağırır; doğrulama x-cron-secret ile.
[functions.publish-scheduled]
verify_jwt = false

# #61: yorum toplama/yanıt gönderimi; pg_cron/pg_net çağırır, doğrulama x-cron-secret ile.
[functions.comments-dispatch]
verify_jwt = false

# #49: token yenileme, doğrulama CRON_SECRET ile.
[functions.refresh-tokens]
verify_jwt = false
