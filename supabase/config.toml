project_id = "ai-influencer-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
enable_signup = false
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]

# [auth.email] enable_signup'ı false yapma: CLI bunu e-posta sağlayıcısını
# tamamen kapatma olarak yorumlar ve magic link girişi de çalışmaz.
# Yeni kayıtları kapatmak için yukarıdaki [auth] enable_signup = false yeterli.

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[storage.buckets.assets]
public = false
file_size_limit = "100MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/avif", "video/mp4", "video/webm"]

[inbucket]
enabled = true
port = 54324

# Üretim kuyruğu worker'ı (#47): pg_cron çağırır, doğrulama x-cron-secret ile.
[functions.process-generations]
verify_jwt = false

# #53: pg_cron/pg_net çağırır; doğrulama JWT yerine x-cron-secret ile (docs/DEVELOPMENT.md §9).
[functions.sync-dispatch]
verify_jwt = false
