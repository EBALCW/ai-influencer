name: Kurulum testi

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/setup-check.yml'
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/setup-mac.sh
        env:
          CI: '1'
      - name: pnpm panel duman testi
        run: |
          eval "$(fnm env --shell bash)"
          fnm use
          pnpm panel --check
        env:
          CI: '1'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\setup-windows.ps1
        env:
          CI: '1'
      - name: pnpm panel duman testi
        shell: powershell
        run: |
          # winget'in eklediği PATH yeni adıma geçmez (kullanıcıda yeni terminal açınca geçer)
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          fnm env --shell powershell | Out-String | Invoke-Expression
          fnm use
          pnpm panel --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CI: '1'
