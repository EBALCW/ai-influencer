name: Otomatik onay ve merge

# CI bir PR için başarıyla bittiğinde çalışır: PR'ı onaylar, merge eder ve CD'yi tetikler.
# workflow_run her zaman main'deki bu dosyanın sürümüyle çalışır ve PR kodunu checkout ETMEZ.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  approve-and-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: PR'ı bul ve uygunluğunu kontrol et
        id: pr
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "Bu commit için açık PR yok."; exit 0; fi

          number=$(jq -r .number <<<"$pr")
          base=$(jq -r .base.ref <<<"$pr")
          head=$(jq -r .head.ref <<<"$pr")
          head_repo=$(jq -r .head.repo.full_name <<<"$pr")
          author=$(jq -r .user.login <<<"$pr")
          draft=$(jq -r .draft <<<"$pr")
          current_sha=$(jq -r .head.sha <<<"$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")

          skip() { echo "::notice::PR #$number otomatik merge edilmedi: $1"; exit 0; }
          [ "$head_repo" = "$GH_REPO" ] || skip "fork'tan gelen PR"
          [ "$draft" = "false" ] || skip "draft PR"
          [ "$current_sha" = "$HEAD_SHA" ] || skip "CI'dan sonra yeni commit gelmiş"
          case ",$labels," in *",bekle,"*) skip "'bekle' label'ı var" ;; esac

          perm=$(gh api "repos/$GH_REPO/collaborators/$author/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *) skip "yazarın ($author) yazma yetkisi yok" ;; esac

          {
            echo "number=$number"
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Onayla
        if: steps.pr.outputs.number
        # Onay zorunlu değil (ruleset: 0 onay + ci-ok); org ayarı kapanırsa merge yine de devam etsin
        continue-on-error: true
        run: |
          gh pr review "${{ steps.pr.outputs.number }}" --approve \
            --body "✅ CI başarılı (lint, typecheck, unit, e2e, Windows, secret taraması). Otomatik onaylandı."

      - name: Merge et
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$HEAD" = "test" ] || [ "$HEAD" = "main" ]; then
            # Uzun ömürlü dallar arası (test -> main): geçmiş korunsun, dal silinmesin
            gh pr merge "$NUMBER" --merge --match-head-commit "$HEAD_SHA"
          else
            gh pr merge "$NUMBER" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          fi

      # GitHub "Closes #N" ile issue'ları sadece varsayılan dala (main) merge'te kapatır.
      # Akışımızda işler önce test'e girdiği için kapatmayı burada yapıyoruz.
      - name: Bağlı issue'ları kapat
        if: steps.pr.outputs.number && steps.pr.outputs.base == 'test'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          text=$(gh pr view "$NUMBER" --json title,body --jq '.title + "\n" + (.body // "")')
          refs=$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<<"$text" | grep -oE '[0-9]+' | sort -u || true)
          for n in $refs; do
            state=$(gh api "repos/$GH_REPO/issues/$n" --jq 'select(.pull_request == null) | .state' 2>/dev/null || true)
            [ "$state" = "open" ] || continue
            gh issue close "$n" --reason completed \
              --comment "✅ #$NUMBER ile \`test\`'e merge edildi. Bir sonraki release ile \`main\`'e gidecek."
          done

      # GITHUB_TOKEN ile yapılan merge 'push' tetiklemez; CD'yi elle başlatıyoruz
      - name: CD'yi tetikle
        if: steps.pr.outputs.number && (steps.pr.outputs.base == 'main' || steps.pr.outputs.base == 'test')
        run: |
          env_name=$([ "${{ steps.pr.outputs.base }}" = "main" ] && echo production || echo test)
          gh workflow run cd.yml --ref "${{ steps.pr.outputs.base }}" -f environment="$env_name"
