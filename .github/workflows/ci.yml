name: CI

on:
  pull_request:
    branches: [main, test]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Unit test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm, setup-node'un cache adımından ÖNCE hazır olmalı
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable && pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm supabase:start
      - name: Reset database and apply migrations
        run: pnpm supabase:db-reset
      - name: Test database policies
        run: pnpm supabase:test
      - name: Veritabanı tipleri migration'larla uyumlu mu?
        run: |
          pnpm supabase:types
          if ! git diff --exit-code -- packages/shared/src/database.types.ts; then
            echo "::error::packages/shared/src/database.types.ts güncel değil. 'pnpm supabase:types' çalıştırıp commit'le."
            exit 1
          fi
      - name: Üretilen tipleri sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: packages/shared/src/database.types.ts
          retention-days: 3
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: panel-build
          path: |
            apps/panel/.next
            !apps/panel/.next/cache
          include-hidden-files: true
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Oturum ve Storage yükleme E2E testleri için yerel Supabase
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Export local Supabase env
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep "^$1=" "$RUNNER_TEMP/sb.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      # NEXT_PUBLIC_* build sırasında koda gömülür; bu yüzden env ile burada build edilir
      - run: pnpm build
      - run: pnpm --filter @ai-influencer/panel exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/panel/playwright-report
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  windows:
    name: Windows uyumluluğu
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets:
    name: Secret taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno lint
      - name: Tip kontrolü
        run: deno check $(find . -name '*.ts' -not -path './node_modules/*')
      - run: deno test --allow-env --permit-no-files

  # Branch korumasında "zorunlu kontrol" olarak bu iş seçilir
  migrations:
    name: Migration kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Var olan migration'lar değişmedi, yeniler sıralı mı?
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs "origin/${{ github.base_ref }}"
      - name: PR dışı çalıştırma
        if: github.event_name != 'pull_request'
        run: echo "Migration kuralları sadece PR'da denetlenir (deploy'da db push sırasız migration'ı zaten reddeder)."

  ci-ok:
    name: ci-ok
    if: always()
    needs: [quality, e2e, windows, secrets, migrations, functions]
    runs-on: ubuntu-latest
    steps:
      - name: Tüm işler başarılı mı?
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
