name: CD

# test dalı  -> "test" ortamı
# main dalı  -> "production" ortamı + GitHub Release + main'i test'e geri senkronize etme
on:
  push:
    branches: [main, test]
  workflow_dispatch:
    inputs:
      environment:
        description: Hedef ortam
        type: choice
        options: [test, production]
        required: true

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Ortam ve dal uyumu
        run: |
          want=${{ github.ref_name == 'main' && 'production' || 'test' }}
          if [ -n "${{ inputs.environment }}" ] && [ "${{ inputs.environment }}" != "$want" ]; then
            echo "::error::'${{ github.ref_name }}' dalı yalnızca '$want' ortamına deploy edilebilir"; exit 1
          fi
          case "${{ github.ref_name }}" in main|test) ;; *) echo "::error::Sadece main ve test deploy edilir"; exit 1 ;; esac

      - uses: actions/checkout@v4

      - name: Supabase secret'ları tanımlı mı?
        id: sb
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secret'ları bu ortamda tanımlı değil, veritabanı/function deploy'u atlandı (docs/WORKFLOW.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ ! -d supabase/migrations ] && [ ! -d supabase/functions ]; then
            echo "Henüz migration veya Edge Function yok, atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.sb.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Migration'ları uygula
        if: steps.sb.outputs.ready == 'true' && hashFiles('supabase/migrations/*.sql') != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Function'ları deploy et
        if: steps.sb.outputs.ready == 'true' && hashFiles('supabase/functions/**/index.ts') != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Özet
        run: |
          {
            echo "### 🚀 ${{ github.ref_name == 'main' && 'production' || 'test' }} deploy"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Supabase: ${{ steps.sb.outputs.ready == 'true' && 'deploy edildi' || 'atlandı' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.ref_name == 'main'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: GitHub Release oluştur
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag zaten var"; exit 0; }
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"

  sync-test:
    if: github.ref_name == 'main'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
      - name: main'i test'e geri birleştir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then echo "test zaten güncel"; exit 0; fi
          if git merge --no-edit origin/main; then
            git push origin test
            gh workflow run cd.yml --ref test -f environment=test
          else
            git merge --abort
            existing=$(gh pr list --base test --head main --state open --json number --jq '.[0].number')
            [ -n "$existing" ] || gh pr create --base test --head main \
              --title "main → test senkronizasyonu (çakışma var)" \
              --body "main'deki değişiklikler test'e otomatik birleştirilemedi. Çakışmaları elle çözün."
            echo "::warning::main → test çakışması var, PR açıldı"
          fi
